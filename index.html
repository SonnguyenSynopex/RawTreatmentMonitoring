<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Raw Treatment & UF Monitoring System</title>
    <link rel="stylesheet" href="./css/styleSvg.css" />
    <link rel="stylesheet" href="./css/layout.css" />
  </head>

  <body>
    <div class="header">
      <div class="header-container">
        <div class="dropdown" id="mainDropdown">
          <button
            class="dropbtn"
            id="menuBtn"
            onclick="toggleMenu()"
            aria-label="Menu"
          >
            <img src="./img/menu.png" alt="Menu" />
          </button>
          <div class="dropdown-content" id="dropdownMenu">
            <div
              class="menu-item"
              onclick="location.href='http://10.100.203.78/scada/'; closeMenu();"
            >
              <img src="./img/home.png" alt="Home" />
              <span class="menu-label" data-lang-en="Home" data-lang-ko="홈"
                >Home</span
              >
            </div>
            <div
              class="menu-item"
              onclick="location.href='index.html'; closeMenu();"
              style="background-color: #6e6e6e"
            >
              <img src="./img/dashboard.png" alt="Dashboard" />
              <span
                class="menu-label"
                data-lang-en="Dashboard"
                data-lang-ko="대시보드"
                >Dashboard</span
              >
            </div>
            <div
              class="menu-item"
              onclick="location.href='./record.html'; closeMenu();"
            >
              <img src="./img/record.png" alt="Record" />
              <span class="menu-label" data-lang-en="Record" data-lang-ko="기록"
                >Record</span
              >
            </div>
            <div
              class="menu-item"
              onclick="location.href='http://10.100.203.78/scada/alarmhistory/'; closeMenu();"
            >
              <img src="./img/alarm.png" alt="Alarm History" />
              <span
                class="menu-label"
                data-lang-en="Alarm History"
                data-lang-ko="알람 기록"
                >Alarm History</span
              >
            </div>
            <div class="menu-item" onclick="openSetting(); closeMenu();">
              <img id="settings" src="./img/setting.png" alt="Settings" />
              <span
                class="menu-label"
                data-lang-en="Settings"
                data-lang-ko="설정"
                >Settings</span
              >
            </div>
            <div class="menu-item language-toggle" onclick="toggleLanguage();">
              <img id="flagImg" src="./img/united-kingdom.png" alt="Flag" />
              <span
                class="menu-label"
                id="languageLabel"
                data-lang-en="English"
                data-lang-ko="한국어"
                >English</span
              >
            </div>
          </div>
        </div>
        <div
          class="LOGO"
          onclick="location.href='http://10.100.203.78/scada/';"
        >
          SYNOPEX
        </div>
        <div class="titlebox" > RAW TREATMENT & UF MONITORING SYSTEM</div>
        <div class="right-section">
          <span id="myTime">00:00:00</span>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- Overlay trong suốt để đóng menu dropdown khi click ra ngoài -->
      <div id="menuOverlay" class="menu-overlay"></div>

      <iframe src="./svg/RawTreatment&UF.svg" frameborder="0" id="left-wapper"></iframe>
    </div>

    <div class="footer">
      <div class="footer-container">
        <div class="status-indicator">
          <span
            class="status-label"
            id="statusLabel"
            data-lang-en="System status: "
            data-lang-ko="시스템 상태: "
            >System status:
          </span>
          <div class="status-light" id="status-light"></div>
        </div>
        <div
          class="scrolling-text"
          style="cursor: pointer"
          onclick="location.href='http://10.100.203.78/scada/alarmhistory';"
        >
          <span id="alarmText">System is normal</span>
        </div>
      </div>
    </div>

    <script src="./js/scolling.js" type="text/javascript"></script>
    <script src="./js/time.js" type="text/javascript"></script>
    <script src="./js/index.js" type="text/javascript"></script>
  </body>
</html>
